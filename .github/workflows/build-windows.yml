name: Build ChemAnalyzer for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies and build
        shell: pwsh
        run: |
          npm install
          npm run dist:win

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ChemAnalyzer-Windows-${{ github.ref_name }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
