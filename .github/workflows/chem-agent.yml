
name: ChemAnalyzer AI Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Telegram connection
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_ADMIN_ID"]

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          payload = json.dumps({
              "chat_id": chat_id,
              "text": "🧪 ChemAnalyzer AI Agent успешно подключён!"
          }).encode()

          req = urllib.request.Request(
              url,
              data=payload,
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(req, timeout=20) as response:
              print("Telegram response:", response.status)
          PY
